[project]
name = "astrbot-plugin-kairo"
version = "0.1.0"
description = "通过 Kairo Driver 为 AstrBot 接入 KK9"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11.18,<4"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
